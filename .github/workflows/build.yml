name: Build NOVA DRIVE APK

on:
  push:
    branches: [main, "feature/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Decode keystore (optional)
        env:
          NOVA_KEYSTORE_BASE64: ${{ secrets.NOVA_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$NOVA_KEYSTORE_BASE64" ]; then
            echo "$NOVA_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/nova.jks"
            echo "NOVA_KEYSTORE_FILE=$RUNNER_TEMP/nova.jks" >> "$GITHUB_ENV"
            echo "NOVA_SIGNED=true" >> "$GITHUB_ENV"
          fi
          # Branch-specific names for the published APK/screenshots branches.
          if [ "$GITHUB_REF_NAME" = "main" ]; then echo "SUFFIX=" >> "$GITHUB_ENV"; else echo "SUFFIX=-$(echo "$GITHUB_REF_NAME" | tr '/' '-')" >> "$GITHUB_ENV"; fi

      - name: Build debug and release APKs
        env:
          NOVA_KEYSTORE_PASSWORD: ${{ secrets.NOVA_KEYSTORE_PASSWORD }}
          NOVA_KEY_ALIAS: ${{ secrets.NOVA_KEY_ALIAS }}
          NOVA_KEY_PASSWORD: ${{ secrets.NOVA_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug :app:assembleRelease --no-daemon

      # A release APK is only published when a stable signing key is configured in secrets.
      - uses: actions/upload-artifact@v4
        if: env.NOVA_SIGNED == 'true'
        with:
          name: NovaDrive-APK
          path: app/build/outputs/apk/release/*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: NovaDrive-APK-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Publish APK to the apk branch
        if: github.event_name == 'push'
        run: |
          mkdir -p "$RUNNER_TEMP/apk"
          if [ "$NOVA_SIGNED" = "true" ]; then cp app/build/outputs/apk/release/*.apk "$RUNNER_TEMP/apk/NovaDrive.apk"; fi
          cp app/build/outputs/apk/debug/*.apk "$RUNNER_TEMP/apk/NovaDrive-debug.apk"
          cd "$RUNNER_TEMP/apk"
          git init -q -b "apk$SUFFIX"
          git -c user.name="github-actions" -c user.email="github-actions@users.noreply.github.com" add .
          git -c user.name="github-actions" -c user.email="github-actions@users.noreply.github.com" commit -qm "APK for ${GITHUB_SHA}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" "apk$SUFFIX"

      # Pushing a tag vX.Y.Z publishes a GitHub Release with the APK and docs/releases/<tag>.md as notes.
      - name: Prepare release files
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          mkdir -p "$RUNNER_TEMP/release"
          cp app/build/outputs/apk/debug/*.apk "$RUNNER_TEMP/release/NovaDrive-${GITHUB_REF_NAME}.apk"
          if [ "$NOVA_SIGNED" = "true" ]; then cp app/build/outputs/apk/release/*.apk "$RUNNER_TEMP/release/NovaDrive-${GITHUB_REF_NAME}-signed.apk"; fi
          NOTES="docs/releases/${GITHUB_REF_NAME}.md"
          if [ -f "$NOTES" ]; then cp "$NOTES" "$RUNNER_TEMP/release/notes.md"; else echo "NovaDrive ${GITHUB_REF_NAME}" > "$RUNNER_TEMP/release/notes.md"; fi

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: NovaDrive ${{ github.ref_name }}
          body_path: ${{ runner.temp }}/release/notes.md
          files: ${{ runner.temp }}/release/*.apk
          make_latest: true

  # Renders the real Compose screens at 1280×720 (Robolectric + Roborazzi) so every change
  # comes with screenshots. Doesn't block the APK build.
  screenshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests and screenshots
        run: |
          chmod +x gradlew
          ./gradlew :app:recordRoborazziDebug --no-daemon

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: NovaDrive-screenshots
          path: |
            app/build/screenshots/*.png
            app/build/reports/tests/
          if-no-files-found: warn

      - name: Publish to the screenshots branch
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p "$RUNNER_TEMP/shots" && cp app/build/screenshots/*.png "$RUNNER_TEMP/shots/"
          if [ "$GITHUB_REF_NAME" = "main" ]; then B=screenshots; else B="screenshots-$(echo "$GITHUB_REF_NAME" | tr '/' '-')"; fi
          cd "$RUNNER_TEMP/shots"
          git init -q -b "$B"
          git -c user.name="github-actions" -c user.email="github-actions@users.noreply.github.com" add .
          git -c user.name="github-actions" -c user.email="github-actions@users.noreply.github.com" commit -qm "Screenshots for ${GITHUB_SHA}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" "$B"
